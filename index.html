<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOXI METRO SHOP 5.0</title>

<style>
body{margin:0;font-family:Arial;background:#0a0d16;color:#fff}
header{background:linear-gradient(90deg,#ffd000,#ff7b00);padding:20px;text-align:center;font-size:24px;font-weight:bold}

.container{padding:15px;max-width:1000px;margin:auto}

.search{
width:100%;
padding:10px;
border-radius:10px;
border:none;
background:#151a2e;
color:#fff;
margin-top:10px;
}

.section-title{margin-top:20px;border-left:4px solid #ffd000;padding-left:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}

.card{
background:#151a2e;
padding:12px;
border-radius:12px;
border:1px solid #2a3555;
}

.card:hover{transform:scale(1.02)}

.price{color:#00ffb3;font-weight:bold}

.btn{
margin-top:6px;
padding:8px;
background:#ff7b00;
border:none;
border-radius:8px;
color:white;
width:100%;
cursor:pointer;
}

.buy{
background:#00ffb3;
color:#000;
}

.cart{
position:fixed;
bottom:0;
width:100%;
background:#12172a;
padding:10px;
}

.remove{
color:red;
cursor:pointer;
}

.order-btn{
width:100%;
margin-top:5px;
padding:8px;
background:#00ffb3;
border:none;
border-radius:8px;
}

/* popup */
.popup{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
}

.popup-box{
background:#151a2e;
padding:20px;
border-radius:12px;
width:90%;
max-width:400px;
}

.input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
background:#0a0d16;
color:#fff;
}
</style>
</head>

<body>

<header>🔥 TOXI METRO SHOP 5.0</header>

<div class="container">

<input class="search" id="search" placeholder="🔍 Поиск..." onkeyup="searchItems()">

<div class="section-title">📦 ТОВАРЫ</div>

<div class="grid">

<div class="card">
<h3>МК14 улучшенная</h3>
<div class="price">4 грн</div>
<button class="btn" onclick="add('МК14 улучшенная',4)">В корзину</button>
<button class="btn buy" onclick="buyNow('МК14 улучшенная',4)">Купить</button>
</div>

<div class="card">
<h3>МК14 ВК</h3>
<div class="price">7 грн</div>
<button class="btn" onclick="add('МК14 ВК',7)">В корзину</button>
<button class="btn buy" onclick="buyNow('МК14 ВК',7)">Купить</button>
</div>

<div class="card">
<h3>МК14 КБ</h3>
<div class="price">7 грн</div>
<button class="btn" onclick="add('МК14 КБ',7)">В корзину</button>
<button class="btn buy" onclick="buyNow('МК14 КБ',7)">Купить</button>
</div>

<div class="card">
<h3>МК14 Сталик</h3>
<div class="price">7 грн</div>
<button class="btn" onclick="add('МК14 Сталик',7)">В корзину</button>
<button class="btn buy" onclick="buyNow('МК14 Сталик',7)">Купить</button>
</div>

<div class="card">
<h3>Шлем</h3>
<div class="price">5 грн</div>
<button class="btn" onclick="add('Шлем',5)">В корзину</button>
<button class="btn buy" onclick="buyNow('Шлем',5)">Купить</button>
</div>

<div class="card">
<h3>Броник</h3>
<div class="price">5 грн</div>
<button class="btn" onclick="add('Броник',5)">В корзину</button>
<button class="btn buy" onclick="buyNow('Броник',5)">Купить</button>
</div>

<div class="card">
<h3>Фулл 6</h3>
<div class="price">9 грн</div>
<button class="btn" onclick="add('Фулл 6',9)">В корзину</button>
<button class="btn buy" onclick="buyNow('Фулл 6',9)">Купить</button>
</div>

</div>
</div>

<!-- КОРЗИНА -->
<div class="cart">
<div id="cart-items">🛒 Пусто</div>
<div id="cart-total">0 грн</div>
<button class="order-btn" onclick="openPopup()">Оформить заказ</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">
<h3>Оформление заказа</h3>
<input class="input" id="nick" placeholder="Введите ник">
<button class="order-btn" onclick="sendOrder()">Отправить</button>
<button class="btn" onclick="closePopup()">Отмена</button>
</div>
</div>

<script>
let cart=[];
let total=0;
let quickItem=null;

/* ДОБАВИТЬ */
function add(name,price){
cart.push(name+" - "+price+" грн");
total+=price;
save();
render();
}

/* КУПИТЬ 1 ТОВАР */
function buyNow(name,price){
quickItem=name+" - "+price+" грн";
openPopup();
}

/* УДАЛИТЬ */
function remove(i){
cart.splice(i,1);
recalc();
save();
}

/* ПЕРЕСЧЕТ */
function recalc(){
total=0;
cart.forEach(i=>total+=parseFloat(i.split(" - ")[1]));
render();
}

/* РЕНДЕР */
function render(){
let html="";
cart.forEach((i,index)=>{
html+=`• ${i} <span class="remove" onclick="remove(${index})">✖</span><br>`;
});
document.getElementById("cart-items").innerHTML = html || "🛒 Пусто";
document.getElementById("cart-total").innerText = total+" грн";
}

/* СОХРАНЕНИЕ */
function save(){
localStorage.setItem("cart",JSON.stringify(cart));
localStorage.setItem("total",total);
}

/* ЗАГРУЗКА */
(function(){
let c=localStorage.getItem("cart");
let t=localStorage.getItem("total");
if(c){
cart=JSON.parse(c);
total=parseFloat(t);
render();
}
})();

/* ПОИСК */
function searchItems(){
let val=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(val)?"block":"none";
});
}

/* POPUP */
function openPopup(){document.getElementById("popup").style.display="flex";}
function closePopup(){document.getElementById("popup").style.display="none";}

/* ОТПРАВКА (ГЛАВНАЯ ФИКС В БАГАХ) */
function sendOrder(){
let nick=document.getElementById("nick").value;
if(!nick){alert("Введите ник");return;}

let text="🛒 Заказ%0A👤 Ник: "+nick+"%0A%0A";

if(quickItem){
text+="• "+quickItem;
quickItem=null;
}else{
if(cart.length==0){alert("Корзина пустая");return;}
cart.forEach(i=>text+="• "+i+"%0A");
text+="%0A💰 Итого: "+total+" грн";
}

window.open("https://t.me/TOXI_YT?text="+text);
}
</script>

</body>
</html>
