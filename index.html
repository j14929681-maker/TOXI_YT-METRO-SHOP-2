<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOXI METRO SHOP 6.0</title>

<style>
body{margin:0;font-family:Arial;background:#0a0d16;color:#fff}

header{
background:linear-gradient(90deg,#ffd000,#ff7b00);
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{padding:15px;max-width:1000px;margin:auto}

/* КНОПКИ КАТЕГОРИЙ */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tab{
padding:8px 12px;
background:#151a2e;
border:none;
border-radius:8px;
color:#fff;
cursor:pointer;
}
.tab.active{background:#ff7b00}

/* ПОИСК */
.search{
width:100%;
padding:10px;
border-radius:10px;
border:none;
background:#151a2e;
color:#fff;
margin-top:10px;
}

.section-title{
margin-top:20px;
border-left:4px solid #ffd000;
padding-left:8px;
}

/* ТОВАРЫ */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
margin-top:10px;
}

.card{
background:#151a2e;
padding:12px;
border-radius:12px;
border:1px solid #2a3555;
transition:0.2s;
}
.card:hover{transform:scale(1.03)}

.price{color:#00ffb3;font-weight:bold}

.btn{
margin-top:6px;
padding:8px;
background:#ff7b00;
border:none;
border-radius:8px;
color:white;
width:100%;
cursor:pointer;
}
.buy{background:#00ffb3;color:#000}

/* КОРЗИНА */
.cart{
position:fixed;
bottom:0;
width:100%;
background:#12172a;
padding:10px;
}

.order-btn{
width:100%;
margin-top:5px;
padding:8px;
background:#00ffb3;
border:none;
border-radius:8px;
}

/* POPUP */
.popup{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
}

.popup-box{
background:#151a2e;
padding:20px;
border-radius:12px;
width:90%;
max-width:400px;
}

.input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
background:#0a0d16;
color:#fff;
}

/* УВЕДОМЛЕНИЕ */
.toast{
position:fixed;
top:20px;
right:20px;
background:#00ffb3;
color:#000;
padding:10px;
border-radius:8px;
display:none;
}
</style>
</head>

<body>

<header>🔥 TOXI METRO SHOP 6.0</header>

<div class="container">

<!-- КАТЕГОРИИ -->
<div class="tabs">
<button class="tab active" onclick="filter('all')">Все</button>
<button class="tab" onclick="filter('pack')">Пакеты</button>
<button class="tab" onclick="filter('gun')">Оружие</button>
<button class="tab" onclick="filter('armor')">Броня</button>
<button class="tab" onclick="filter('other')">Другое</button>
</div>

<input class="search" id="search" placeholder="🔍 Поиск..." onkeyup="searchItems()">

<div class="grid" id="items">

<!-- ПАКЕТЫ -->
<div class="card pack">
<h3>Бюджет пакет</h3><div class="price">8 грн</div>
<button class="btn" onclick="add('Бюджет пакет',8)">В корзину</button>
<button class="btn buy" onclick="buyNow('Бюджет пакет',8)">Купить</button>
</div>

<div class="card pack">
<h3>VIP пакет</h3><div class="price">13 грн</div>
<button class="btn" onclick="add('VIP пакет',13)">В корзину</button>
<button class="btn buy" onclick="buyNow('VIP пакет',13)">Купить</button>
</div>

<!-- ОРУЖИЕ -->
<div class="card gun">
<h3>МК14 ВК</h3><div class="price">7 грн</div>
<button class="btn" onclick="add('МК14 ВК',7)">В корзину</button>
<button class="btn buy" onclick="buyNow('МК14 ВК',7)">Купить</button>
</div>

<div class="card gun">
<h3>МК14 КБ</h3><div class="price">7 грн</div>
<button class="btn" onclick="add('МК14 КБ',7)">В корзину</button>
<button class="btn buy" onclick="buyNow('МК14 КБ',7)">Купить</button>
</div>

<!-- БРОНЯ -->
<div class="card armor">
<h3>Шлем</h3><div class="price">5 грн</div>
<button class="btn" onclick="add('Шлем',5)">В корзину</button>
<button class="btn buy" onclick="buyNow('Шлем',5)">Купить</button>
</div>

<div class="card armor">
<h3>Броник</h3><div class="price">5 грн</div>
<button class="btn" onclick="add('Броник',5)">В корзину</button>
<button class="btn buy" onclick="buyNow('Броник',5)">Купить</button>
</div>

<!-- ДРУГОЕ -->
<div class="card other">
<h3>Теплак</h3><div class="price">5 грн</div>
<button class="btn" onclick="add('Теплак',5)">В корзину</button>
<button class="btn buy" onclick="buyNow('Теплак',5)">Купить</button>
</div>

</div>
</div>

<!-- КОРЗИНА -->
<div class="cart">
<div id="cart-items">🛒 Пусто</div>
<div id="cart-total">0 грн</div>
<button class="order-btn" onclick="openPopup()">Оформить заказ</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">
<h3>Оформление заказа</h3>
<input class="input" id="nick" placeholder="Введите ник">
<button class="order-btn" onclick="sendOrder()">Отправить</button>
</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Добавлено в корзину</div>

<script>
let cart=[];
let total=0;
let quickItem=null;

/* КОРЗИНА */
function add(n,p){
cart.push(n+" - "+p+" грн");
total+=p;
render();
toast("Добавлено");
}

function buyNow(n,p){
quickItem=n+" - "+p+" грн";
openPopup();
}

/* РЕНДЕР */
function render(){
let html="";
cart.forEach(i=>html+="• "+i+"<br>");
document.getElementById("cart-items").innerHTML=html||"🛒 Пусто";
document.getElementById("cart-total").innerText=total+" грн";
}

/* ПОИСК */
function searchItems(){
let v=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(v)?"block":"none";
});
}

/* ФИЛЬТР */
function filter(type){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");

document.querySelectorAll(".card").forEach(c=>{
if(type==="all") c.style.display="block";
else c.style.display=c.classList.contains(type)?"block":"none";
});
}

/* POPUP */
function openPopup(){document.getElementById("popup").style.display="flex";}

/* SEND */
function sendOrder(){
let nick=document.getElementById("nick").value;
if(!nick){alert("Введите ник");return;}

let text="🛒 Заказ%0A👤 Ник: "+nick+"%0A%0A";

if(quickItem){
text+="• "+quickItem;
quickItem=null;
}else{
if(cart.length==0){alert("Корзина пустая");return;}
cart.forEach(i=>text+="• "+i+"%0A");
text+="%0A💰 Итого: "+total+" грн";
}

window.open("https://t.me/TOXI_YT?text="+text);
}

/* TOAST */
function toast(t){
let x=document.getElementById("toast");
x.innerText=t;
x.style.display="block";
setTimeout(()=>x.style.display="none",1000);
}
</script>

</body>
</html>
